<!DOCTYPE html>
<html lang="en">
<head>
	<title>FRACTURE</title>
	<link rel="icon" type="image/x-icon" href="./assets/favicon1.ico">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
</head>
<body style="background-color:#333; margin:0; padding:0; overflow:hidden;">

<!-- Import maps polyfill -->
<!-- Remove this when import maps will be widely supported -->
<script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>

<script type="importmap">{ "imports": { 
	"three": "./libs/three.module.js",
	"three/addons/": "./libs/jsm/",
	"uil": "./libs/uil.module.js"
}}</script>

<script type="module">

import * as THREE from 'three'
import * as UIL from 'uil'
//import { Pane } from 'tweakpane'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js'
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js'
//import Stats from 'three/addons/libs/stats.module.js'


import { Fracture, FragmentsToMesh } from "./src/Fracture.js";

let fragments = [];
let currentModel = ''
let currentMesh = null;

const modes = {
    Convex: 'Convex',
    Non_Convex:'Non-Convex'
}

const models = {
    head: 'head',
    donut:'donut',
    spring:'spring',
    sphere:'sphere',
    nymph:'nymph',
    box:'box',
    test:'test'
}

const options = {
    model: "head",
    break:0.06,

    fragmentCount: 50,
    fracturePlanes : { x: true, y: true, z: true },

    
    fractureMode : "Non-Convex",
    textureScale : new THREE.Vector2(1, 1),
    textureOffset : new THREE.Vector2(),

    debug:false,
}

let needResize = false;
let breaked
let gui

const scene = new THREE.Scene()

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000)
camera.position.z = 2;
camera.position.x = 0.3;
camera.position.y = 0.2;

const renderer = new THREE.WebGLRenderer({antialias: true})
renderer.setSize(window.innerWidth, window.innerHeight)
document.body.appendChild(renderer.domElement)
renderer.toneMapping = THREE.CineonToneMapping;
renderer.toneMappingExposure = 0.6;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;

let plane = new THREE.PlaneGeometry( 6, 6, 1, 1 );
plane.rotateX( -Math.PI*0.5 );
let mat = new THREE.ShadowMaterial( { color: 0x020108, opacity:0.5 } )
const floor = new THREE.Mesh( plane, mat );
floor.position.y = -0.5
floor.receiveShadow = true;
scene.add( floor );

const controls = new OrbitControls(camera, renderer.domElement)


const hemiLight = new THREE.HemisphereLight( 0xffffff, 0xffffff, 0.1 );
hemiLight.color.setHSL( 0.6, 1, 0.6 );
hemiLight.groundColor.setHSL( 0.095, 1, 0.75 );
hemiLight.position.set( 0, 50, 0 );
scene.add( hemiLight );

let s = 4;
const dirLight = new THREE.DirectionalLight(0xffffff, 10);
dirLight.position.set( -0.1, 1.6, 0.4 );
dirLight.castShadow = true;
dirLight.shadow.camera.near = 0.1;
dirLight.shadow.camera.far = 3;
dirLight.shadow.camera.right = s;
dirLight.shadow.camera.left = - s;
dirLight.shadow.camera.top  = s;
dirLight.shadow.camera.bottom = - s;
dirLight.shadow.mapSize.width = dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.radius = 4;
dirLight.shadow.bias = - 0.0005;

dirLight.shadow.intensity = 1;
scene.add( dirLight );

const loader = new THREE.TextureLoader();
const texture = loader.load( './assets/round.png' );
texture.colorSpace = THREE.SRGBColorSpace;
const internMaterial = new THREE.MeshStandardMaterial({ map:texture, roughness:0.8, shadowSide:THREE.DoubleSide })

//let g = new THREE.CameraHelper(dirLight.shadow.camera)boundingSphere
//scene.add( g );

window.addEventListener( 'resize',() => { needResize = true; }, false )


const gltfLoader = new GLTFLoader().setPath( './assets/' );
gltfLoader.setDRACOLoader( new DRACOLoader().setDecoderPath( './assets/draco/gltf/' ).setDecoderConfig( { type: 'js' } ) );


initGui()
animate()
startDemo()


function initGui(){

	gui = new UIL.Gui({ css:'top:10px; right:10px;', w:250, close:false });

	gui.add( options, 'model', { type:'List', list:models }).onChange( addModel )
	gui.add( options, 'fractureMode', { type:'List', list:modes })

	gui.add( options.fracturePlanes, 'x', {})
	gui.add( options.fracturePlanes, 'y', {})
	gui.add( options.fracturePlanes, 'z', {})

	gui.add( options, 'fragmentCount', { rename:'fragment', min: 2, max: 500,  step: 1 })
	gui.add( options, 'break', { min: 0, max: 1,  step: 0.01 }).onChange( breaker )
	gui.add( options, 'debug', {}).onChange( wireframe )

	gui.add( 'button', { name:'Reset' }).onChange( addModel )

}


function animate( stamp = 0 ) {

    requestAnimationFrame(animate);
    if( needResize ) resize()
    renderer.render(scene, camera);

}

function resize() {

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    needResize = false;

}

function wireframe(v) {

    if(currentMesh){
        currentMesh.material.wireframe = v
        currentMesh.material.color.setHex(v ? 0x00FF00: 0xFFFFFF)
        currentMesh.material.emissive.setHex(v ? 0x00FF00: 0x000000)
    }
    internMaterial.wireframe = v
    internMaterial.color.setHex(v ? 0xFF0000: 0xFFFFFF)
    internMaterial.emissive.setHex(v ? 0xFF0000: 0x000000)

}

function breaker() {

    let i = fragments.length, obj;
    while(i--){
        obj = fragments[i];
        obj.position.copy(obj.userData.origin).addScaledVector( obj.userData.direction, options.break )
    }

}

function clear() {

    scene.remove(...fragments);

}

async function startDemo(){

    const rgbeLoader = new RGBELoader().setPath( './' );
    const [ env ] = await Promise.all( [ rgbeLoader.loadAsync( './assets/lobe.hdr' ) ]);
    env.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = env;
    scene.background = env;
    scene.backgroundIntensity = 0.5;
    scene.environmentIntensity = 0.5
    scene.backgroundBlurriness = 0.5;

    addModel();

}

async function addModel(){

    clear()

    if( currentModel !== options.model ){

        const gltf = await gltfLoader.loadAsync(options.model+'.glb' );

        gltf.scene.traverse((child) => {
            if(child.isMesh) {
                child.receiveShadow = true;
                child.castShadow = true;
                child.material.shadowSide = THREE.DoubleSide;
                currentMesh = child;
            }
        })

        currentModel = options.model;

    }


    // BREAK ME

    const fracures = Fracture( currentMesh, options );

    fragments = FragmentsToMesh( fracures, currentMesh, internMaterial );

    scene.add(...fragments);

    breaker()


}


</script></body></html>
